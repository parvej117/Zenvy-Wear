<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal Login — Zenvy Wear</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body style="background: #111; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;">

  <div style="background: #1c1c1e; border: 1px solid #27272a; border-radius: 8px; padding: 40px 32px; max-width: 440px; width: 100%; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
    
    <div style="text-align: center; margin-bottom: 28px;">
      <span class="brand-logo" style="color: #fff; font-size: 1.6rem;">ZENVY WEAR</span>
      <span class="status-pill" style="background: #c2a684; color: #111; font-weight: 700; margin-top: 8px;">ADMINISTRATIVE CONSOLE</span>
      <p style="color: #a1a1aa; font-size: 0.88rem; margin-top: 10px;">Sign in to access sales analytics, catalog, orders, and customer management.</p>
    </div>

    <!-- 1-Click Demo Fill -->
    <div style="background: #27272a; border-radius: 6px; padding: 12px; margin-bottom: 24px; text-align: center;">
      <button type="button" class="btn btn-secondary btn-sm" onclick="fillAdminDemo()" style="color: #fff; border-color: #52525b; width: 100%;">
        <i class="fas fa-bolt" style="color: #c2a684;"></i> One-Click Fill Admin Credentials
      </button>
    </div>

    <div id="auth-error-alert" style="display: none; background: #7f1d1d; border: 1px solid #b91c1c; color: #fecaca; border-radius: 6px; padding: 12px; font-size: 0.85rem; margin-bottom: 20px;"></div>

    <form onsubmit="handleAdminLogin(event)">
      <div style="margin-bottom: 18px;">
        <label style="font-size: 0.85rem; font-weight: 600; display: block; margin-bottom: 6px; color: #e4e4e7;">Admin Email</label>
        <input type="email" id="admin-login-email" required placeholder="admin@zenvywear.com" style="width: 100%; padding: 12px 14px; border: 1px solid #3f3f46; border-radius: 4px; font-size: 0.92rem; background: #27272a; color: #fff;">
      </div>

      <div style="margin-bottom: 24px;">
        <label style="font-size: 0.85rem; font-weight: 600; display: block; margin-bottom: 6px; color: #e4e4e7;">Password</label>
        <input type="password" id="admin-login-pass" required placeholder="••••••••" style="width: 100%; padding: 12px 14px; border: 1px solid #3f3f46; border-radius: 4px; font-size: 0.92rem; background: #27272a; color: #fff;">
      </div>

      <button type="submit" class="btn btn-white btn-lg" style="width: 100%;">
        Enter Management Portal <i class="fas fa-arrow-right" style="font-size: 0.8rem; margin-left: 6px;"></i>
      </button>
    </form>

    <div style="text-align: center; margin-top: 24px; font-size: 0.82rem; color: #71717a;">
      <a href="/" style="color: #a1a1aa;"><i class="fas fa-home"></i> Back to Main Storefront</a>
    </div>

  </div>

  <script src="/js/main.js"></script>
  <script>
    function fillAdminDemo() {
      document.getElementById('admin-login-email').value = 'admin@zenvywear.com';
      document.getElementById('admin-login-pass').value = 'admin123456';
      showToast('Admin demo credentials populated!', 'info');
    }

    async function handleAdminLogin(e) {
      e.preventDefault();
      const email = document.getElementById('admin-login-email').value.trim();
      const password = document.getElementById('admin-login-pass').value;

      const res = await apiRequest('/auth/login', {
        method: 'POST',
        body: JSON.stringify({ email, password })
      });

      if (res.ok && res.data.user) {
        if (res.data.user.role !== 'admin') {
          const alert = document.getElementById('auth-error-alert');
          alert.textContent = 'Access Denied: You do not have administrator permissions.';
          alert.style.display = 'block';
          return;
        }

        Storage.setToken(res.data.token);
        Storage.setUser(res.data.user);
        showToast('Admin authorized. Redirecting...', 'success');
        setTimeout(() => window.location.href = '/admin/dashboard.html', 700);
      } else {
        const alert = document.getElementById('auth-error-alert');
        alert.textContent = res.data.message || 'Invalid administrator credentials.';
        alert.style.display = 'block';
      }
    }
  </script>
</body>
</html>
